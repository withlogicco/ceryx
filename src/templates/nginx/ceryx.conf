map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $proxy_set_x_forwarded_proto {
    default $scheme;
    'http'  http;
    'https' https;
}

server {
    listen 80;
    listen 443 ssl http2;
    default_type text/html;

    # CERYX_SSL_DEFAULT_* are the Ceryx 0.x names.
    ssl_certificate {{ default .Env.CERYX_TLS_DEFAULT_CERTIFICATE (default .Env.CERYX_SSL_DEFAULT_CERTIFICATE "/etc/ceryx/ssl/default.crt") }};
    ssl_certificate_key {{ default .Env.CERYX_TLS_DEFAULT_KEY (default .Env.CERYX_SSL_DEFAULT_KEY "/etc/ceryx/ssl/default.key") }};
    ssl_certificate_by_lua_file {{ default .Env.CERYX_LUALIB_DIR "/usr/local/share/ceryx/lualib" }}/certificate.lua;

    location /.well-known/acme-challenge {
        content_by_lua_block {
            if auto_ssl then
                auto_ssl:challenge_server()
            else
                ngx.exit(ngx.HTTP_NOT_FOUND)
            end
        }
    }

    location / {
        set $target "fallback";

        # Lua files
        access_by_lua_file {{ default .Env.CERYX_LUALIB_DIR "/usr/local/share/ceryx/lualib" }}/router.lua;

        # Proxy configuration
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-Proto $proxy_set_x_forwarded_proto;

        # Upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect ~^(http://[^:]+):\d+(/.+)$ $2;
        proxy_redirect ~^(https://[^:]+):\d+(/.+)$ $2;
        proxy_redirect / /;

        proxy_pass $target;
    }

    error_page 400 /400.html;
    error_page 404 /404.html;
    error_page 500 /500.html;
    error_page 503 /503.html;
    location ~ ^/(400|404|500|503)\.html$ {
        internal;
        root {{ default .Env.CERYX_STATIC_DIR "/etc/ceryx/static" }};
    }

    # Static assets used by the error pages. The pages are served
    # for arbitrary request paths, so assets must be referenced absolutely.
    location ^~ /_ceryx/ {
        alias {{ default .Env.CERYX_STATIC_DIR "/etc/ceryx/static" }}/;
    }
}

{{ if ne (lower (default .Env.CERYX_DISABLE_LETS_ENCRYPT "")) "true" }}
# Launch the Let's Encrypt certificate internal server running on port 8999, if
# `CERYX_DISABLE_LETS_ENCRYPT` is *not* set to `true`.

server {
    listen 127.0.0.1:8999;
    client_body_buffer_size 1m;
    client_max_body_size 1m;
    location / {
        content_by_lua_block {
            auto_ssl:hook_server()
        }
    }
}
{{ end }}
