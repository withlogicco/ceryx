load_module /usr/lib/nginx/modules/ndk_http_module.so;
load_module /usr/lib/nginx/modules/ngx_http_lua_module.so;

user www-data www-data;
worker_processes 1;
pid /run/nginx.pid;

env CERYX_DISABLE_LETS_ENCRYPT;
env CERYX_LETS_ENCRYPT_CA;
env CERYX_LOG_LEVEL;
env CERYX_REDIS_PREFIX;
env CERYX_REDIS_HOST;
env CERYX_REDIS_PASSWORD;
env CERYX_REDIS_PORT;
env CERYX_REDIS_TIMEOUT;
env CERYX_STORAGE_BACKEND;
env CERYX_SQLITE_PATH;
env CERYX_SQLITE_MMAP_SIZE;
env CERYX_SQLITE_WAL_MODE;
env CERYX_SQLITE_POOL_MODE;
env CERYX_ROUTE_SETTINGS_DEFAULT_ENFORCE_HTTPS;
env CERYX_ROUTE_SETTINGS_DEFAULT_MTLS_REQUIRE_CLIENT_CERTIFICATE;
env CERYX_MTLS_DEFAULT_TRUSTED_CA;
env CERYX_MTLS_DEFAULT_VERIFY_DEPTH;

events {
    worker_connections 1024;
}

http {
    # Basic Settings
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s 30s;
    client_max_body_size  {{ default .Env.CERYX_MAX_REQUEST_BODY_SIZE "100m" }};

    # Use the Docker internal DNS, pick your favorite if running outside of Docker
    resolver {{ default .Env.CERYX_DNS_RESOLVER "127.0.0.11" }};

    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr {{ default .Env.CERYX_LOG_LEVEL "info" }};

    # Lua settings
    lua_package_path "{{ default .Env.CERYX_LUALIB_DIR "/usr/local/share/ceryx/lualib" }}/?.lua;{{ default .Env.CERYX_LUALIB_DIR "/usr/local/share/ceryx/lualib" }}/?/init.lua;/usr/local/share/lua/5.1/?.lua;/usr/local/share/lua/5.1/?/init.lua;;";
    lua_package_cpath "/usr/local/lib/lua/5.1/?.so;/usr/lib/lua/5.1/?.so;/usr/lib/*/lua/5.1/?.so;;";

    lua_shared_dict ceryx 1m;
    lua_shared_dict auto_ssl 1m;
    lua_shared_dict auto_ssl_settings 64k;
    {{ if eq (lower (default .Env.CERYX_DEBUG "")) "true" }}
    lua_code_cache off;
    {{ else }}
    lua_code_cache on;
    {{ end }}

    {{ if ne (lower (default .Env.CERYX_DISABLE_LETS_ENCRYPT "")) "true" }}
    # Enable automatic Let's Encryps certificate generation, if
    # `CERYX_DISABLE_LETS_ENCRYPT` is *not* set to `true`.
    # Check out https://github.com/openresty/lua-resty-core
    init_by_lua_file "{{ default .Env.CERYX_LUALIB_DIR "/usr/local/share/ceryx/lualib" }}/letsencrypt.lua";

    init_worker_by_lua_block {
        auto_ssl:init_worker()
    }
    {{ end }}

    # Includes
    include mime.types;
    include ceryx.conf;
    include api.conf;
    include /etc/nginx/sites-enabled/*;
}
