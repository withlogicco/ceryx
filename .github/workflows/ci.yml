name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test (${{ matrix.setup }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # compose.test.yml runs on SQLite; its redis and redis-password
        # profiles run the same stack on Redis, through their own test service.
        include:
          - setup: sqlite
            service: test
          - setup: redis
            service: test-redis
          - setup: redis-password
            service: test-redis-password

    env:
      COMPOSE_FILE: compose.test.yml
      COMPOSE_PROFILES: ${{ matrix.setup }}
      IMAGE_TAG: ${{ github.sha }}
      CERYX_DISABLE_LETS_ENCRYPT: "true"
      CERYX_TEST_RESULTS_DIR: /tmp/test-results

    steps:
      - uses: actions/checkout@v7.0.1

      # GHCR names must be lowercase; owner names may not be.
      - name: set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4.2.0

      - uses: docker/bake-action@v7.5.0
        with:
          source: .
          files: compose.test.yml
          targets: ceryx,test
          load: true
          set: |
            ceryx.cache-from=type=gha,scope=ceryx
            ceryx.cache-to=type=gha,scope=ceryx,mode=max
            test.cache-from=type=gha,scope=test
            test.cache-to=type=gha,scope=test,mode=max

      # Facilitates CI log debugging
      - run: docker compose run --rm --no-deps --entrypoint sh ceryx -c 'nginx -V; luajit -v'

      # Starts the services the test service depends on, then runs it.
      - name: pytest
        run: |
          docker compose run --rm \
            -v "${CERYX_TEST_RESULTS_DIR}:${CERYX_TEST_RESULTS_DIR}" \
            ${{ matrix.service }} pytest -v tests \
            --junitxml "${CERYX_TEST_RESULTS_DIR}/${{ matrix.setup }}.xml"

      - if: failure()
        run: docker compose logs --no-color

      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pytest-results-${{ matrix.setup }}
          path: ${{ env.CERYX_TEST_RESULTS_DIR }}/${{ matrix.setup }}.xml
          if-no-files-found: error

  test-summary:
    name: Publish test summary
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: pytest-results-*
          path: test-results
          merge-multiple: true
        continue-on-error: true

      - name: publish test summary
        run: python bin/test_summary.py --reports-dir test-results

      - name: Fail when matrix failed
        if: needs.test.result != 'success'
        run: exit 1

  build:
    runs-on: ubuntu-latest
    needs: test-summary

    # Branches other than main only run the tests.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4.2.0

      # GHCR names must be lowercase; owner names may not be.
      - name: set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Same build as the test job's ceryx service, so it comes from the cache.
      # Tags: the commit SHA, plus latest on main or the tag name on v* tags.
      - uses: docker/bake-action@v7.5.0
        with:
          source: .
          files: compose.test.yml
          targets: ceryx
          push: true
          set: |
            ceryx.target=final
            ceryx.cache-from=type=gha,scope=ceryx
            ceryx.tags=${{ env.IMAGE_NAME }}:${{ github.sha }}
            ceryx.tags=${{ env.IMAGE_NAME }}:${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
